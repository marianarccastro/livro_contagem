<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-labelledby="title desc">
<title id="title">Quatro organizações que representam o anagrama OSSO</title>
<desc id="desc">Duas organizações das letras O, cada uma acompanhada de duas organizações das letras S. São quatro organizações, representadas por O azul, O verde, S roxo e S rosa.</desc>
